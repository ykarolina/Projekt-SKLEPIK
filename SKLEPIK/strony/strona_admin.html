<head>

    <link rel="stylesheet" href="../style/styl_panel_admin.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
</head>
<body>
    <header class="banner">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <div class="logoDiv">
                <img src="../grafiki/loga/zegowskaSzama_v2.png" class="logo">
            </div>
            <div class="kontener2">
                <a href="strona_glowna.html"><img src="../grafiki/loga/logo_hot-dog.png" class="imgHeader"> Produkty</a> 
                <a href="strona_koszyk.html"><img src="../grafiki/loga/logo_koszyk.png" class="imgHeader"> Koszyk</a>
                <a href="#"><img src="../grafiki/loga/logo_konto.png" class="imgHeader"> Konto</a>
               
            </div>
            <div class="menuTel" onclick="toggleMenu()">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>

        <nav class="navTel" id="mobileMenu">
            <a href="strona_glowna.html"><img src="../grafiki/loga/logo_hot-dog.png" class="imgHeader"> Produkty</a> 
            <a href="strona_koszyk.html"><img src="../grafiki/loga/logo_koszyk.png" class="imgHeader"> Koszyk</a>
            <a href="#"><img src="../grafiki/loga/logo_konto.png" class="imgHeader"> Konto</a>
        </nav>
    </header>

      <section class="container mt-5">
        <div class="row justify-content-center">
        <div class="col-12 text-center mb-4">
            <h1 class="tytulAdmin">Panel administratora</h1>
        </div>

        <div class="col-12">
            <div class="row g-2 justify-content-center">
                <div class="col-4 col-md-auto p-1 d-flex justify-content-center">
                    <button type="button" class="btn btnAdminPanel">lista uzytkowników</button>
                </div>
                <div class="col-4 col-md-auto p-1 d-flex justify-content-center">
                    <button type="button" class="btn btnAdminPanel">zmiana ról</button>
                </div>
                <div class="col-4 col-md-auto p-1 d-flex justify-content-center">
                    <button type="button" class="btn btnAdminPanel">dodawanie produktu</button>
                </div>

                <div class="col-6 col-md-auto p-1 d-flex justify-content-center">
                    <button type="button" class="btn btnAdminPanel">edycja i usuwanie produktów</button>
                </div>
                <div class="col-6 col-md-auto p-1 d-flex justify-content-center">
                    <button type="button" class="btn btnAdminPanel">lista zamówien</button>
                </div>
            </div>
        </div>
        </div>
      </section>
     <section class="zmianaRol container mt-5">
        <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6 d-flex justify-content-center">
            <div class="ramka p-4">
                <h2 class="tytulPanel fs-3 mb-4 text-center">ZMIANA ROLI UZYTKOWIKA</h2>
                <form>
                    <div class="d-flex align-items-center justify-content-center mb-3 flex-wrap gap-3">
                        <label class="labelLogRej">nazwa uzytkownika:</label>
                        <input type="text" name="nazwaUzytkownika" class="inputAdmin">
                    </div>

                    <div class="d-flex align-items-center justify-content-center flex-wrap gap-4">
                        <div class="d-flex align-items-center gap-2">
                            <label>rola:</label>
                            <select name="rola" class="py-1">
                                <option value="user">user</option>
                                <option value="admin">admin</option>
                            </select>
                        </div>
                        <button type="submit" class="btnAdminPanel px-4 w-auto">zmien role</button>
                    </div>
                </form>
            </div>
            </div>
            </div>
        </section>


        <section class="dodajProdukt container mt-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6 d-flex justify-content-center">
            <div class="ramka p-4">
                <h2 class="tytulPanel fs-3 mb-4 text-center">DODAJ PRODUKT</h2>
                <form>
                    <div class="mb-3 text-start px-md-4">
                        <label class="d-block mb-1">Nazwa:</label>
                        <input type="text" name="nazwaProduktu" class="inputAdmin w-100">
                    </div>

                    <div class="mb-3 text-start px-md-4">
                        <label class="d-block mb-1">Kategoria:</label>
                        <select name="kategoria" class="inputAdmin w-auto min-width-select">
                           
                        </select>
                    </div>

                    <div class="mb-3 text-start px-md-4">
                        <label class="d-block mb-1">Nazwa zdjecie(.rozszerzenie):</label>
                        <input type="text" name="foto" class="inputAdmin w-100">
                    </div>

                    <div class="mb-3 text-start px-md-4">
                        <label class="d-block mb-1">Cena</label>
                        <input type="number" step="0.01" name="cena" class="inputAdmin w-100">
                    </div>

                    <div class="d-flex justify-content-center gap-4 mb-4">
                        <div class="form-check d-flex align-items-center gap-2">
                            <input class="custom-radio" type="radio" name="promocja" id="brak" value="0" checked>
                            <label class="labelLogRej" for="brak">brak promocji</label>
                        </div>
                        <div class="form-check d-flex align-items-center gap-2">
                            <input class="custom-radio" type="radio" name="promocja" id="na" value="1">
                            <label class="labelLogRej" for="na">na promocji</label>
                        </div>
                    </div>

                    <div class="text-center">
                        <button type="submit" class="btnAdminPanel px-5 py-2 w-auto mx-auto">dodaj produkt</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>

<section class="sectionEdycja container mt-5">
    <h2 class="tytulPanel fs-2 mb-5 text-center">EDYTUJ PRODUKT</h2>
    <div class="row gy-5 align-items-start justify-content-center">
        <div class="col-12 col-md-5 ps-md-5">
            <h3 class="fs-4 mb-3 text-center text-md-start">lista produktów</h3>
            <div class="d-flex flex-column align-items-center align-items-md-start">
                <label class="mb-1">kategoria:</label>
                <select name="katLista">
                    <option value="kawa">kawa</option>
                    <option value="jedzenie">jedzenie</option>
                </select>
                </div>
        </div>
        <div class="col-12 col-md-6 d-flex justify-content-center justify-content-md-end">
            <div class="ramkaEdycja p-4">
                <h2 class="tytulPanel fs-3 mb-4 text-center">EDYTOWANIE PRODUKTU</h2>

                <form class="formEdycja d-flex flex-column gap-3">
                    <div class="divEdycja d-flex gap-3">
                        <label class="labEdycja mb-0">Numer produktu:</label>
                        <input type="text" name="nrProduktu" class="InpEdycja">
                    </div>

                    <div class="divEdycja d-flex gap-3">
                        <label class="labEdycja mb-0">edytuj pole:</label>
                        <select name="wyborPola" class="InpEdycja">
                            <option value="nazwa">nazwa</option>
                            <option value="cena">cena</option>
                        </select>
                    </div>

                    <div class="divEdycja d-flex gap-3">
                        <label class="labEdycja mb-0">zmiana na:</label>
                        <input type="text" name="nowaWartosc" class="InpEdycja">
                    </div>

                    <div class="d-flex justify-content-center align-items-center mt-2">
                        <button type="submit" class="btnadminzatwierdz">
                            zaktualizuj produkt
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>

   <footer class="stopka">
    <div class="container">
        <div class="row align-items-center gy-4 gy-md-0">
            <div class="col-12 col-md-4 text-start dane">
                <p><strong>Adres:</strong> al. Bielska 100, 43-100 Tychy</p>
                <p><strong>Kontakt:</strong> 32 217 38 22</p>
                <p><strong>Autorzy:</strong></p>
            </div>

            <div class="col-12 col-md-4 text-center zeg">

            </div>
            
            <div class="col-12 col-md-4 text-md-end media">

                    <a href="#"><img src="../grafiki/loga/logo_ig.png" alt="Instagram"></a>

            </div>
        </div>

        function toggleMenu() {
            document.getElementById('mobileMenu').classList.toggle('active');

</footer>
