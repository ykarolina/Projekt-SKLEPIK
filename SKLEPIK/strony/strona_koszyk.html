<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zegowska Szama - Twoje produkty</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style/styl_header_footer.css">
    <link rel="stylesheet" href="../style/styl_koszyk.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
</head>
<body>
    <header class="banner">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <div class="logoDiv">
                <img src="../grafiki/loga/zegowskaSzama_v2.png" class="logo">
            </div>
            <div class="kontener2">
                <a href="strona_glowna.html"><img src="../grafiki/loga/logo_hot-dog.png" class="imgHeader"> Produkty</a> 
                <a href="#"><img src="../grafiki/loga/logo_konto.png" class="imgHeader"> Konto</a>
                <a href="#"><img src="../grafiki/loga/admin.png" class="imgHeader"> Admin</a>
            </div>
            <div class="menuTel" onclick="toggleMenu()">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>

        <nav class="navTel" id="mobileMenu">
            <a href="strona_glowna.html"><img src="../grafiki/loga/logo_hot-dog.png" class="imgHeader"> Produkty</a>
            <a href="#"><img src="../grafiki/loga/logo_konto.png" class="imgHeader"> Konto</a>
            <a href="#"><img src="../grafiki/loga/admin.png" class="imgHeader"> Admin</a>
        </nav>
    </header>
        <!-- <section class="sectionPustyKosz">
            <div class="content">
                <h2 class="tytulLPustyKosz">Twój koszyk jest pusty</h2>
                <button type="button" class="btnPustyKosz">
                    <a href="strona_glowna.html">Rozpocznij zakupy</a>
                </button>
            </div>
        </section> -->
    

    <section class="koszykPelny">
        <h2 class="tytulKoszykPelny">Twoje produkty</h2>

        <div class="listaProduktow">

            <div class="pojedynczyProdukt d-flex flex-column flex-md-row align-items-center justify-content-between">
                <div class="produktInfo d-flex flex-column flex-md-row align-items-center">
                    <img src="../grafiki/na_cieplo/hot_dog.jpg" alt="hot-dog" class="imgProdukt">
                    <div class="produktOpis text-center text-md-start">
                        <span class="nazwa">hot-dog</span>
                        <span class="dodatki">sos: musztarda</span>
                    </div>
                </div>

                <div class="cena my-2 my-md-0">5,50zł</div>

                <div class="akcje d-flex flex-row flex-md-column align-items-center align-items-md-end gap-3 gap-md-1">
                    <div class="ilosc">ilosc: 1 <button class="zmienIlosc">+</button></div>
                    <button class="btnUsun">usun z koszyka</button>
                </div>
            </div>

            <div class="pojedynczyProdukt d-flex flex-column flex-md-row align-items-center justify-content-between">
                <div class="produktInfo d-flex flex-column flex-md-row align-items-center">
                    <img src="../grafiki/kawy/espresso.png" alt="espresso" class="imgProdukt">
                    <div class="produktOpis text-center text-md-start">
                        <span class="nazwa">espresso</span>
                    </div>
                </div>

                <div class="cena my-2 my-md-0">1,50zł</div>

                <div class="akcje d-flex flex-row flex-md-column align-items-center align-items-md-end gap-3 gap-md-1">
                    <div class="ilosc">ilosc: 1 <button class="zmienIlosc">+</button></div>
                    <button class="btnUsun">usun z koszyka</button>
                </div>
            </div>

        </div>

        <div class="podsumowanie">
            <p class="koszt">Koszt zamówienia: 7,00zł</p>
            <button class="btnRealizuj">Zrealizuj zamówienie</button>
        </div>
    </section>

    <footer class="stopka">
        <div class="container">
            <div class="row align-items-center gy-4 gy-md-0">
                <div class="col-12 col-md-4 text-start dane">
                    <p><strong>Adres:</strong> al. Bielska 100, 43-100 Tychy</p>
                    <p><strong>Kontakt:</strong> 32 217 38 22</p>
                    <p><strong>Autorzy:</strong></p>
                </div>

                <div class="col-12 col-md-4 text-center zeg">
                    <img src="../grafiki/loga/logo_zeg.png" alt="Logo ZEG" class="logoZEG">
                    <p class="mb-0">Zespół Szkół nr 4 im. J. Groszkowskiego w Tychach</p>
                </div>
                
                <div class="col-12 col-md-4 text-md-end media">
                    <span>Nasze media</span>
                    <div class="ikony">
                        <a href="#"><img src="../grafiki/loga/logo_ig.png" alt="Instagram"></a>
                        <a href="#"><img src="../grafiki/loga/logo_fb.png" alt="Facebook"></a>
                        <a href="#"><img src="../grafiki/loga/logo_www.png" alt="WWW"></a>
                    </div>
                </div>
            </div>
        </div>
    </footer>

    <script>
        function toggleMenu() {
            document.getElementById('mobileMenu').classList.toggle('active');
        }
    </script>
</body>
</html>
